[project]
name = "qpool"
version = "0.1.0"
description = "Quota pooling + cost-aware routing control plane for coding agents"
requires-python = ">=3.9"
dependencies = ["tomlkit>=0.13,<1", "zstandard>=0.23,<1"]

[project.scripts]
qpool = "qp.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qp", "qp.*"]

[tool.setuptools.package-data]
qp = ["static/*.html", "static/*.js", "static/*.css", "_vendor/hiroute/LICENSE", "_vendor/hiroute/SOURCE.md"]
