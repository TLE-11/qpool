[project]
name = "qpool"
version = "0.1.0"
description = "Quota pooling + cost-aware routing control plane for coding agents"
requires-python = ">=3.9"

[project.scripts]
qpool = "qp.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qp"]
